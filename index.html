<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ARABA OYUNU 🚗💨</title>
<style>
    * { box-sizing:border-box; }
  body { margin:0; background:#111; color:white; font-family:system-ui; display:flex; justify-content:center; overflow:hidden; }
  .box { width:100%; max-width:480px; text-align:center; }
  h1 { margin:8px; font-size:24px; }
  #game { position:relative; width:100%; height:520px; background:#2d2d2d; overflow:hidden; border:3px solid #444; }
  /* YOL */
  .road { position:absolute; top:0; bottom:0; width:70%; left:15%; background:#333; border-left:4px dashed yellow; border-right:4px dashed yellow; }
  .line { position:absolute; left:50%; width:6px; height:50px; background:white; margin-left:-3px; }
  /* ARABALAR */
  .car { position:absolute; width:52px; height:92px; border-radius:12px; font-size:42px; display:flex; align-items:center; justify-content:center; }
  #myCar { background:#ff2e7e; bottom:20px; left:50%; transform:translateX(-50%); z-index:10; box-shadow:0 0 20px #ff2e7e; }
  .enemy { background:#222; }
  /* SKOR */
  .top { display:flex; justify-content:space-between; padding:8px 12px; font-weight:800; }
  /* TUŞLAR */
  .controls { display:flex; justify-content:space-between; padding:12px; gap:10px; }
  .btn { flex:1; padding:20px 0; font-size:28px; border-radius:18px; border:0; background:#333; color:white; }
  .btn:active { background:#ff2e7e; }
  .gas { background:#2e9e4f !important; }
  .brake { background:#c0392b !important; }
  #startBtn { width:94%; padding:16px; background:#ff2e7e; color:white; border:0; border-radius:14px; font-size:18px; font-weight:800; margin:10px 0; }
  #msg { font-size:20px; font-weight:800; margin:6px; }
</style>
</head>
<body>
<div class="box">
  <h1>🚗 ARABA OYUNU 💨</h1>
  <div class="top"><span>🏆 SKOR: <span id="score">0</span></span><span>💨 HIZ: <span id="speed">0</span></span></div>

  <div id="game">
    <div class="road"></div>
    <div id="myCar" class="car">🚗</div>
    <div id="msg"></div>
  </div>

  <button id="startBtn" onclick="start()">▶️ OYUNU BAŞLAT</button>

  <div class="controls">
    <button class="btn" ontouchstart="left=true" ontouchend="left=false" onmousedown="left=true" onmouseup="left=false">◀️</button>
    <button class="btn brake" ontouchstart="slow=true" ontouchend="slow=false" onmousedown="slow=true" onmouseup="slow=false">🛑</button>
    <button class="btn gas" ontouchstart="fast=true" ontouchend="fast=false" onmousedown="fast=true" onmouseup="fast=false">💨 GAZ</button>
    <button class="btn" ontouchstart="right=true" ontouchend="right=false" onmousedown="right=true" onmouseup="right=false">▶️</button>
  </div>
  <div style="font-size:13px;color:#aaa;padding-bottom:10px">◀️ ▶️ direksiyon, 💨 GAZ hızlandırır, 🛑 fren yapar<br>Klavyede: Ok tuşları / A-D de çalışır</div>
</div>

<script>
// ============ DEĞİŞKENLER ============
let x = 50, speed = 0, score = 0, playing = false;
let left=false, right=false, fast=false, slow=false;
let enemies = [], lines = [];
let gameEl = document.getElementById('game');

// ============ YOL ÇİZGİLERİ ============
for(let i=0;i<6;i++){
  let l = document.createElement('div');
  l.className='line'; l.style.top = (i*90)+'px';
  gameEl.appendChild(l); lines.push(l);
}

// ============ BAŞLAT ============
function start(){
  if(playing) return;
  playing=true; score=0; speed=30; x=50; enemies=[];
  document.querySelectorAll('.enemy').forEach(e=>e.remove());
  document.getElementById('msg').innerText='';
  document.getElementById('startBtn').innerText='🏁 OYUN DEVAM EDİYOR...';
  requestAnimationFrame(loop);
  setInterval(spawn, 900);
}

function spawn(){
  if(!playing) return;
  let e = document.createElement('div');
  e.className='car enemy';
  e.innerText = ['🚕','🚙','🚚','🚐','🚓'][Math.floor(Math.random()*5)];
  let ex = 18 + Math.random()*60; // yol içinde
  e.style.left = ex + '%'; e.style.top = '-100px';
  gameEl.appendChild(e);
  enemies.push({el:e, y:-100, x:ex});
}

// ============ OYUN DÖNGÜSÜ ============
function loop(){
  if(!playing) return;

  // HIZ
  if(fast) speed += 1.5;
  if(slow) speed -= 2;
  if(!fast && !slow) speed -= 0.3;
  if(speed < 0) speed = 0;
  if(speed > 160) speed = 160;

  // DİREKSİYON
  if(left) x -= 1.2 + speed/80;
  if(right) x += 1.2 + speed/80;
  if(x < 16) x = 16;
  if(x > 78) x = 78;

  // ARABAYI ÇİZ
  let car = document.getElementById('myCar');
  car.style.left = x + '%';

  // YOL ÇİZGİSİ AKIYOR
  lines.forEach(l=>{
    let t = parseInt(l.style.top) + speed/8;
    if(t > 520) t = -50;
    l.style.top = t + 'px';
  });

  // DÜŞMANLAR GELİYOR
  enemies.forEach((en, i)=>{
    en.y += 3 + speed/15;
    en.el.style.top = en.y + 'px';
    // ÇARPTI MI?
    if(en.y > 380 && en.y < 470 && Math.abs(en.x - x) < 9){
      gameOver();
    }
    if(en.y > 560){ en.el.remove(); enemies.splice(i,1); score+=10; }
  });

  if(speed > 10) score += 1;

  document.getElementById('score').innerText = score;
  document.getElementById('speed').innerText = Math.floor(speed);
  requestAnimationFrame(loop);
}

function gameOver(){
  playing=false;
  document.getElementById('msg').innerHTML = '💥 KAZA YAPTIN!<br>SKOR: '+score+'<br>Tekrar oyna!';
  document.getElementById('msg').style.color='#ff2e7e';
  document.getElementById('startBtn').innerText='🔁 TEKRAR OYNA';
}

// ============ KLAVYE ============
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft'||e.key==='a') left=true;
  if(e.key==='ArrowRight'||e.key==='d') right=true;
  if(e.key==='ArrowUp'||e.key==='w') fast=true;
  if(e.key==='ArrowDown'||e.key==='s') slow=true;
});
document.addEventListener('keyup', e=>{
  if(e.key==='ArrowLeft'||e.key==='a') left=false;
  if(e.key==='ArrowRight'||e.key==='d') right=false;
  if(e.key==='ArrowUp'||e.key==='w') fast=false;
  if(e.key==='ArrowDown'||e.key==='s') slow=false;
});
</script>
</body>
</html>
